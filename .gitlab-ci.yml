# Library CI on every push and merge request: tests, clippy and docs; a real
# wasm32 build; the JavaScript bindings exercised from Node; and the MSRV.
# Nothing is released from here: crates.io publishing is done by hand.

image: rust:1

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
  CARGO_TERM_COLOR: always

cache:
  key: cargo-${CI_JOB_NAME}
  paths: [.cargo-home/registry, target/]

stages: [test]

test:
  stage: test
  script:
    - rustup component add clippy
    - cargo build --all-features
    - cargo test --all-features
    - cargo test
    - cargo clippy --all-targets --all-features -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
    - cargo run --example quickstart
    - cargo run --example stream_decode --features stream
    - cargo run --example repair_json --features repair
    - cargo run --example chat_template --features jinja,secrets

wasm-js:
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq nodejs >/dev/null
    - rustup target add wasm32-unknown-unknown
    - cargo build --release --target wasm32-unknown-unknown
    - cargo build --release --target wasm32-unknown-unknown --features js,stream,repair,jinja,secrets
    # wasm-bindgen-cli must match the wasm-bindgen crate version exactly.
    - WB=$(cargo pkgid wasm-bindgen | sed 's/.*@//')
    - curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WB}/wasm-bindgen-${WB}-x86_64-unknown-linux-musl.tar.gz" | tar xz
    - ./wasm-bindgen-${WB}-x86_64-unknown-linux-musl/wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/release/llm_wasm.wasm
    - node examples/node/smoke.mjs pkg

# The oldest Rust this crate promises to build on (rust-version in Cargo.toml).
msrv:
  stage: test
  image: rust:1.88
  variables:
    # pick dependency versions that support this Rust
    CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  script:
    - cargo build --all-features
