[package]
name = "llm-wasm"
version = "0.4.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "If your cost guard needs Tokio, it cannot run where the call starts. LLM call logic with no I/O for wasm32 and native: real prices and budget ledger, retry with Retry-After, guards, routing, cache, stream decoding, JSON repair, JS bindings."
readme = "README.md"
repository = "https://github.com/Mattbusel/llm-wasm"
documentation = "https://docs.rs/llm-wasm"
keywords = ["llm", "wasm", "budget", "cost", "edge"]
categories = ["wasm", "web-programming", "api-bindings"]
include = ["src/**/*.rs", "benches/**/*.rs", "examples/*.rs", "examples/node/*.mjs", "scripts/update_prices.py", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[features]
default = []
## JavaScript bindings via wasm-bindgen (estimateCost, extractJson, renderTemplate, Ledger, Retry, Cache, StreamDecoder, ...).
js = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
## Decode streamed (SSE) responses from OpenAI, Anthropic and compatible APIs (sse-core).
stream = ["dep:sse-core", "dep:bytes"]
## Repair almost-JSON from models: trailing commas, single quotes, Python literals, cut-off output (json5).
repair = ["dep:json5"]
## Jinja templates and Hugging Face chat templates (minijinja).
jinja = ["dep:minijinja", "dep:minijinja-contrib"]
## SecretGuard: block or redact API keys, emails and card numbers before they leave (regex).
secrets = ["dep:regex"]
## Price models from llm-prices 1.2 (dated, source-cited rows with long-context tiers),
## falling back to the built-in table for models it does not list.
llm-prices = ["dep:llm-prices"]
## `rig::CostLedgerHook`: price every rig agent turn and stop the run at a USD budget
## (rig-agent 0.46; needs Rust 1.97.1, while the rest of the crate builds on 1.88).
rig = ["dep:rig-agent"]
## Internal: rig's mock models for this crate's rig tests and example. Not part of the API.
__rig-test-utils = ["rig", "rig-agent/test-utils"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# collision-resistant cache keys, and an LRU bound for the cache
sha2 = { version = "0.11", default-features = false }
lru = { version = "0.18", default-features = false }
# feature "js"
wasm-bindgen = { version = "0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# feature "stream"
sse-core = { version = "0.2", default-features = false, features = ["std"], optional = true }
bytes = { version = "1", optional = true }
# feature "repair"
json5 = { version = "1.3", optional = true }
# feature "jinja"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "std_collections", "macros", "multi_template", "json", "loop_controls", "fuel"], optional = true }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"], optional = true }
# feature "secrets"
regex = { version = "1", default-features = false, features = ["std"], optional = true }
# feature "llm-prices"
llm-prices = { version = "1.2", default-features = false, optional = true }
# feature "rig"
rig-agent = { version = "0.46", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
llm_wasm_011 = { package = "llm-wasm", version = "=0.1.1" }
tokio = { version = "1.40", features = ["macros", "rt"] }

[[bench]]
name = "vs_alternatives"
harness = false

[[example]]
name = "quickstart"

[[example]]
name = "stream_decode"
required-features = ["stream"]

[[example]]
name = "chat_template"
required-features = ["jinja", "secrets"]

[[example]]
name = "repair_json"
required-features = ["repair"]

# Runs offline against rig's mock model:
# cargo run --example rig_usd_budget --features __rig-test-utils
[[example]]
name = "rig_usd_budget"
required-features = ["rig", "__rig-test-utils"]

# rig's mock models need rig-agent's `test-utils` feature (and Rust 1.97.1).
[[test]]
name = "rig_hook"
required-features = ["rig", "__rig-test-utils"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
